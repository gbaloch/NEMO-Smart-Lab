[project]
name = "NEMO-smart-lab"
version = "0.1.0"
description = "Plugin for NEMO to analyze and display instrument data gathered from connected tools."
keywords = ["NEMO", "networking", "dataviz"]
readme = "README.md"
authors = [{name = "Ghazan Baloch", email = "gbaloch@stanford.edu"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "django",
    "matplotlib",
    "msgpack",
    "numpy",
    "requests",
]
license = {file = "LICENSE.md"}

[project.urls]
Homepage = "https://github.com/SNF-Root/NEMO-Smart-Lab"
Changelog = "https://github.com/SNF-Root/NEMO-Smart-Lab/issues"
Issues = "https://github.com/SNF-Root/NEMO-Smart-Lab/issues"

[project.optional-dependencies]
NEMO-CE = ["NEMO-CE>=7.3.0"]
NEMO = ["NEMO>=7.3.0"]
dev-tools = ["pre-commit", "djlint", "black"]

[tool.setuptools.packages.find]
include = ["NEMO_smart_lab*"]
exclude = ["NEMO_smart_lab.tests", "NEMO_smart_lab.tests.*"]

[tool.setuptools.package-data]
NEMO_smart_lab = ["static/**/*", "templates/**/*"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.djlint]
profile = "django"
max_attribute_length = 100
max_line_length = 120
ignore = "H031"
